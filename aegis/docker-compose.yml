# Local AEGIS backing services. Not required for `make demo` (which runs offline).
services:
  nats:
    image: nats:latest
    command: ["-js"]
    ports: ["4222:4222"]
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_PASSWORD: aegis }
    ports: ["5432:5432"]
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
  temporal:
    image: temporalio/auto-setup
    ports: ["7233:7233"]
